[project]
name = "llm-kie"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.15.0",
    "apted>=1.0.3",
    "distance>=0.1.3",
    "editdistance>=0.8.1",
    "ipdb>=0.13.13",
    "jieba>=0.42.1",
    "levenshtein>=0.27.4",
    "lxml>=6.1.3",
    "nltk>=3.10.3",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "zss>=1.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
